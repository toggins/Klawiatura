name: Build and release binary distributions

on:
  workflow_dispatch:

  pull_request:
    paths-ignore: &ig
      - README.md
      - .*

  push:
    branches: [master]
    tags: [v*]
    paths-ignore: *ig

env:
  CRAZY_AHH_DEPS: >-
    python3-jinja2
    libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev
    libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev
    libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev
    libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev
    libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev
    libdecor-0-dev liburing-dev

jobs:
  build:
    name: Build ${{ matrix.name }} binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Win32
          - os: windows-latest
            name: Win64
          - os: ubuntu-latest
            name: HTML5

    env:
      CACHE_BUST: 6
      SCCACHE_GHA_ENABLED: true
      OUTNAME: Klawiatura-${{ github.ref_name == 'master' && 'dev' || github.ref_name }}-${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ethically source Discord Social SDK
        if: matrix.name != 'HTML5' && !github.event.repository.fork && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config --global init.defaultBranch master
          git -C external/discord init
          git -C external/discord pull https://${{ secrets.EXTERNAL_TOKEN }}@github.com/${{ secrets.EXTERNAL_USER }}/discord.git master

      - name: Install dependencies (Linux)
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.os == 'ubuntu-latest'
        with:
          version: 2.1
          packages: ${{ env.CRAZY_AHH_DEPS }}

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: py -m pip install jinja2

      - name: Source pasture-raised gluten-free emsdk
        uses: emscripten-core/setup-emsdk@main
        if: matrix.name == 'HTML5'
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Set up MSVC (${{ matrix.name }})
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        with:
          arch: ${{ matrix.name == 'Win32' && 'x86' || 'x64' }}

      - name: Cache build artifacts
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ env.CACHE_BUST }}-${{ matrix.name }}-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ env.CACHE_BUST }}-${{ matrix.name }}-${{ github.ref_name }}-
            ${{ env.CACHE_BUST }}-${{ matrix.name }}-

      - name: Configure
        shell: bash
        run: |
          [[ "${{ matrix.name == 'HTML5' && '1' || '0' }}" == "1" ]] && \
            source "${{ github.workspace }}/emsdk-cache/emsdk-main/emsdk_env.sh"

          ${{ matrix.name == 'HTML5' && 'emcmake ' || '' }}cmake \
            -G Ninja -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_C_COMPILER_LAUNCHER=sccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -D CPACK_PACKAGE_FILE_NAME=${{ env.OUTNAME }}

      - name: Build
        run: |
          cmake --build build --target ${{ matrix.name == 'HTML5' && 'Klawiatura' || 'all' }}

      - name: Package binaries
        if: matrix.name != 'HTML5'
        run: cmake --build build --target package

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: |
            build/
            !build/_deps/**

  release:
    name: Release binaries
    needs: build

    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork && github.event_name != 'pull_request' }}

    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout HTML5 www/
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: fuck

      - name: Release binaries
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ github.ref_name != 'master' }}
          tag_name: ${{ github.ref_name == 'master' && 'dev' || github.ref_name }}
          prerelease: ${{ github.ref_name == 'master' }}
          files: fuck/build-*/Klawiatura-*.zip

      - name: Prepare for HTML5 distibution
        run: cp -vr fuck/build-HTML5/Klawiatura.{js,wasm,data} www

      - name: Publish HTML5
        id: publish
        uses: nonk123/sanity-action@master
        with: { push_to_github_pages: true }
